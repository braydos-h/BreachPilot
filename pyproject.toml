[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netattackai"
version = "0.49.12"
description = "AI-driven, locally-run penetration testing / bug bounty research agent"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11"
authors = [
    {name = "NetAttackAI Team"},
]
keywords = ["security", "penetration-testing", "nmap", "ai", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "ollama>=0.6.1",
    "httpx>=0.27.0",
    "mcp>=1.27.0,<2.0.0",
    "PyYAML>=6.0.2",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "fastapi>=0.110.0",
    "websockets>=12.0",
    "questionary>=2.0.0",
    "numpy>=1.24.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.3.0",
    "ruff>=0.6.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
netattackai = "main:main"

[tool.setuptools]
py-modules = [
    "agent_loop",
    "app",
    "cli",
    "db",
    "evidence",
    "executor",
    "finding_verifier",
    "main",
    "mcp_exploit_server",
    "mcp_server",
    "memory",
    "mission",
    "observer",
    "outcome_judge",
    "planner",
    "report_generator",
    "risk_controller",
    "scope_gate",
    "summarizer",
    "target_graph",
    "task_queue",
    "tool_router",
]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# ponytail: bare module names, not "main.py". The ".py" suffix makes coverage
# find_spec("main.py") at startup, which executes main.py (pulling numpy in via
# tools.skill_embeddings) and then purges it from sys.modules — numpy's C
# extension can't re-init, so every later `import numpy` dies with
# "cannot load module more than once per process".
source = ["tools", "main", "cli"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.ruff]
line-length = 120
# ponytail: exclude generated/runtime dirs + non-Python webui/oauth so `ruff check .` stays <200
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "exploit_workspace",
    "research_workspace",
    "reports",
    "webui",
    "oauth",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F405", "F403", "F841"]
# ponytail: star-import helpers (tools/mcp_tools/* via `from registry import *`) are intentional;
# F405/F403 are the allowlist-lock wiring, not accidental shadowing. F841 (unused-variable)
# in attack modules is often a placeholder for future params.

[tool.ruff.lint.per-file-ignores]
# Lab build: operator-box filesystem is unrestricted; path-traversal gates removed intentionally
"tools/mcp_tools/*.py" = ["F405", "F403", "F401", "F841", "E402"]
"tools/kernel/*.py" = ["F401"]
"tests/*.py" = ["F401", "F841", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# ponytail: expand from 8 to all tools/* + main.py/cli.py/db.py/mission.py gradually.
# Disable the noisiest codes that currently block `mypy tools` (359 errors) until
# each family is typed incrementally. No `Any` in new code; use Optional/TypedDict.
disable_error_code = [
    "no-any-return",
    "attr-defined",
    "union-attr",
    "assignment",
    "arg-type",
    "call-arg",
    "operator",
    "index",
    "list-item",
    "return-value",
    "type-var",
    "valid-type",
    "no-redef",
    "var-annotated",
    "misc",
]

[[tool.mypy.overrides]]
module = "tools.*"
ignore_errors = false
disable_error_code = [
    "no-any-return",
    "attr-defined",
    "union-attr",
    "assignment",
    "arg-type",
    "call-arg",
    "operator",
    "index",
    "list-item",
]

[[tool.mypy.overrides]]
module = ["tools.exceptions", "tools.validation_utils", "tools.nmap_priv"]
warn_return_any = false
