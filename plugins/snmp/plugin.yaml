name: snmp
version: 0.1.0
description: SNMP enumeration plugin - snmpwalk/snmp-check style queries for system inventory, users, processes, and community-string guessing. Target-touching tools are allowlist-locked; plugin default-off.
author: BreachPilot
capabilities: [attack_module, mcp_tool]
enabled: false
config_section:
  snmp:
    enabled: false
    timeout: 10
    default_version: 2c
    community_env: SNMP_COMMUNITY
