name: browser_attack
version: 0.1.0
description: Headless Chromium/Playwright driver for authenticated web testing + XSS-hunter callbacks. Browser-based attacks (authenticated flows, DOM XSS, hook callbacks). Target-touching tools are allowlist-locked; XSS callback hosts must be in exploit.allowed_targets.
author: BreachPilot
capabilities: [mcp_tool]
target_touching: true
provides_mcp_tools: [browser_attack_navigate, browser_dom_xss_probe, browser_xss_callbacks, browser_xss_record_callback]
enabled: false
config_section:
  browser_attack:
    enabled: false
    browser: chromium
    headless: true
    timeout_seconds: 60
    xss_callback_host: ""
    xss_callback_port: 5555
