name: wireless
version: 0.1.0
description: Wireless/BT assessment integration - bettercap/aircrack-ng/hcxtools/bluez for authorized WLAN/BT testing. Radio-touching tools are allowlist-gated (BSSID as the target identifier); plugin default-off.
author: BreachPilot
capabilities: [mcp_tool]
target_touching: true
provides_mcp_tools: [wireless_crack_pmkid, wireless_deauth, wireless_pmkid_capture, wireless_recon]
enabled: false
config_section:
  wireless:
    enabled: false
    bettercap_path: bettercap
    aircrack_path: aircrack-ng
    hcxtools_path: hcxdumptool
    interface: wlan0mon
    channel_timeout_seconds: 30
