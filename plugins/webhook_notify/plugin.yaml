name: webhook_notify
version: 0.1.0
description: Outbound-only Slack/Discord run-status notifications. Pings a webhook URL when a run hits a milestone/finding so the operator does not have to poll the WebUI.
author: BreachPilot
capabilities: [event_subscriber, config]
# opt-in: plugins default to disabled; enable via config plugins.enabled list
enabled: false
config_section:
  webhook_notify:
    enabled: false
    url: ""
    events:
      - finding
      - state
    timeout_seconds: 5
    max_retries: 3
    backoff_seconds: 2.0
    max_payload_chars: 8192