name: sliver_c2
version: 0.1.0
description: Sliver C2 bridge - implant generation, team server, session management. Mirrors tools/metasploit_bridge.py for modern C2. Target-touching tools are allowlist-locked; callback hosts must be added to exploit.allowed_targets.
author: NetAttackAi
capabilities: [mcp_tool]
enabled: false
config_section:
  sliver_c2:
    enabled: false
    server_binary: sliver-server
    client_binary: sliver
    grpc_host: 127.0.0.1
    grpc_port: 31337
    config_path: ~/.sliver/config