[package]
name = "bp-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bp-sidecar"
path = "src/main.rs"

[dependencies]
bp-allowlist = { path = "../bp-allowlist" }
bp-exec = { path = "../bp-exec" }
bp-evidence = { path = "../bp-evidence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
