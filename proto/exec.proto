syntax = "proto3";

package breachpilot.exec.v1;

// IDL source of truth for the Go<->Rust execution protocol (v1).
// Transport: JSON over loopback TCP (Unix socket on Linux prod).
// Every message carries version="v1" for negotiation.

message ExecRequest {
  string version = 1;             // must be "v1"
  string id = 2;
  repeated string argv = 3;       // no shell; argv[0] is the binary
  repeated string targets = 4;    // extracted targets for allowlist gate
  repeated string allowed_targets = 5; // effective allowlist union
  bool require_allowlist = 6;     // fail closed when true and union empty
  uint64 timeout_seconds = 7;     // 1..3600
  uint64 max_output_bytes = 8;    // capped 1KB..4MB
}

message ExecResult {
  string version = 1;
  string id = 2;
  bool ok = 3;
  int32 exit_code = 4;
  string stdout = 5;
  string stderr = 6;
  bool timed_out = 7;
  uint64 duration_ms = 8;
  ExecError error = 9;
}

message ExecError {
  string code = 1; // SANDBOX_SCOPE_DENIED | SANDBOX_TIMEOUT | SANDBOX_SPAWN_FAILED | SANDBOX_INVALID
  string message = 2;
}

message HealthRequest { string version = 1; string id = 2; }
message HealthResponse { string version = 1; string id = 2; bool ok = 3; }

service ExecSidecar {
  rpc Exec(ExecRequest) returns (ExecResult);
  rpc Health(HealthRequest) returns (HealthResponse);
}
