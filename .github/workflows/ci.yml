name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Run test suite shard (offline/mocked)
        # Shard the file list deterministically (every 2nd file) so each job
        # stays small; the union of shards is the full suite. Keeps -n 2 and
        # the integration/live_llm deselect (operator-hardware + hermetic rules).
        run: |
          mapfile -t FILES < <(python -c "import pathlib; print('\n'.join(sorted(str(p) for p in pathlib.Path('tests').glob('test_*.py'))))")
          TOTAL=2
          SHARD=${{ matrix.shard }}
          SELECTED=()
          for i in "${!FILES[@]}"; do
            if [ $((i % TOTAL)) -eq $((SHARD - 1)) ]; then SELECTED+=("${FILES[$i]}"); fi
          done
          echo "shard $SHARD/$TOTAL: ${#SELECTED[@]} files"
          if [ ${#SELECTED[@]} -eq 0 ]; then echo "shard selected no files" >&2; exit 1; fi
          python -m pytest "${SELECTED[@]}" -q -n 2 -m "not integration and not live_llm"

  sandbox:
    name: Sandbox integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Build sandbox worker image
        run: docker build -t breachpilot-sandbox:latest docker/sandbox
      - name: Verify sandbox worker image
        run: docker image inspect breachpilot-sandbox:latest
      - name: Sandbox unit + integration tests (real Docker containment)
        run: |
          python -m pytest tests/test_sandbox_models.py \
            tests/test_sandbox_policy.py \
            tests/test_sandbox_network.py \
            tests/test_sandbox_backend.py \
            tests/test_sandbox_manager.py \
            tests/test_sandbox_mcp_exec.py \
            tests/test_sandbox_integration.py -v
      - name: Dump sandbox diagnostics on failure
        if: failure()
        run: |
          docker ps -a --filter "label=breachpilot=true" || true
          docker network ls --filter "label=breachpilot=true" || true
          for c in $(docker ps -aq --filter "label=breachpilot=true"); do docker logs "$c" 2>&1 | tail -50; done || true

  browser:
    name: Browser integration (Playwright + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev + browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev,browser]"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Build sandbox base worker image (browser FROM dependency)
        run: docker build -t breachpilot-sandbox:latest docker/sandbox
      - name: Build sandbox browser worker image
        run: docker build -t breachpilot-sandbox:browser -f docker/sandbox/Dockerfile.browser docker/sandbox
      - name: Browser unit + mocked tests (no Chromium needed)
        run: |
          python -m pytest tests/test_browser_playwright_backend.py \
            tests/test_browser_manager_async.py \
            tests/test_browser_mcp_tools.py \
            tests/test_browser_integration.py \
            tests/test_no_playwright_regression.py \
            tests/test_doctor_browser.py \
            tests/test_browser_capabilities.py \
            tests/test_api_capabilities_browser.py -v
      - name: Browser live-Chromium integration (loopback only)
        run: python -m pytest tests/test_browser_integration.py -v -m integration
      - name: Doctor browser SKIP contract (with and without SDK)
        run: |
          python - <<'PY'
          # With SDK + Chromium installed (this job): host-ready, green, not skipped.
          from tools.doctor import _check_browser
          from tools.browser.doctor_check import CHROMIUM_SKIP_HINT, SDK_SKIP_HINT
          ready = _check_browser(
              {"browser": {"enabled": True, "backend": "playwright"}, "sandbox": {"enabled": False}}
          )
          assert ready["name"] == "browser" and ready["ok"] is True, ready
          assert not ready.get("skipped", False), ready
          print(f"doctor with-SDK: ok={ready['ok']} value={ready.get('value')}")

          # Without SDK (stock install simulation): SKIP with the install hint,
          # not FAIL — same hint the live tests skip with.
          import builtins, importlib.util as _ilu
          _real_import, _real_find_spec = builtins.__import__, _ilu.find_spec
          def _blocked(name, *a, **k):
              if name == "playwright" or str(name).startswith("playwright."):
                  raise ImportError("playwright blocked by browser CI contract step")
              return _real_import(name, *a, **k)
          def _no_pw(name, *a, **k):
              if name == "playwright" or str(name).startswith("playwright."):
                  return None
              return _real_find_spec(name, *a, **k)
          builtins.__import__, _ilu.find_spec = _blocked, _no_pw
          try:
              import sys
              for mod in [m for m in sys.modules if m == "playwright" or m.startswith("playwright.")]:
                  del sys.modules[mod]
              skipped = _check_browser(
                  {"browser": {"enabled": True, "backend": "playwright"}, "sandbox": {"enabled": False}}
              )
          finally:
              builtins.__import__, _ilu.find_spec = _real_import, _real_find_spec
          assert skipped["ok"] is True, skipped
          assert skipped.get("skipped") is True and skipped.get("status") == "skip", skipped
          assert skipped["hint"] == SDK_SKIP_HINT, skipped
          print(f"doctor without-SDK: ok={skipped['ok']} skipped={skipped['skipped']} hint={skipped['hint']!r}")
          print("doctor browser SKIP contract: OK (green with and without SDK)")
          PY

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Run tests with coverage
        run: python -m coverage run -m pytest tests/ -q -m "not integration and not live_llm"
      - name: Terminal coverage report
        run: python -m coverage report --fail-under=80
      - name: XML coverage report
        run: python -m coverage xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint (ruff + guards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Cache ruff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: ShellCheck install.sh (warning level)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh
          bash -n install.sh
          echo "ShellCheck + bash -n: OK"
      - name: MCP bare-except guard (no hidden BaseExceptionGroup)
        run: |
          # Fail if any MCP-adjacent bare `except Exception` hides a BaseExceptionGroup.
          # Anyio task groups (stdio_client / streamable_http_client / ClientSession)
          # raise BaseExceptionGroup on subprocess death — bare `except Exception` misses it.
          # Use `_EXC_GROUP_CATCH` + `_log_nested_exceptions` (tools/exceptions.py) instead.
          # Non-MCP bare excepts are allowed but must be explicit: `# ponytail: bare except intentional`
          # or `# noqa: BLE001` (repo convention for intentional broad-except, 250+ sites).
          if grep -R --include="*.py" -n "except Exception" tools/mcp_tools tools/exploit_agent tools/mcp_session.py | grep -v "_EXC_GROUP_CATCH" | grep -v "ponytail: bare except intentional" | grep -v "noqa: BLE001" | grep -q .; then
            echo "ERROR: bare 'except Exception' found in MCP-adjacent code without _EXC_GROUP_CATCH."
            echo "Use 'except _EXC_GROUP_CATCH as exc:' + '_log_nested_exceptions(exc)' (see tools/exceptions.py)."
            echo "If this is intentionally non-MCP, annotate with '# ponytail: bare except intentional' or '# noqa: BLE001'."
            echo "--- offenders ---"
            grep -R --include="*.py" -n "except Exception" tools/mcp_tools tools/exploit_agent tools/mcp_session.py | grep -v "_EXC_GROUP_CATCH" | grep -v "ponytail: bare except intentional" | grep -v "noqa: BLE001" || true
            exit 1
          fi
          echo "MCP bare-except guard: OK"
      - name: God-file budget (OR threshold + grandfathered growth tracking)
        run: python scripts/god_file_budget.py
      - name: Config schema / YAML sync check (top-level keys)
        run: |
          python -c "
          import yaml
          from tools.config_manager import CONFIG_SCHEMA
          cfg = yaml.safe_load(open('config.yaml'))
          assert set(cfg) == set(CONFIG_SCHEMA), f'config.yaml and CONFIG_SCHEMA drift: extra in yaml {sorted(set(cfg)-set(CONFIG_SCHEMA))}, missing in yaml {sorted(set(CONFIG_SCHEMA)-set(cfg))}'
          "
      - name: Requirements / pyproject sync check
        run: |
          python -c "
          import pathlib, re, tomllib
          py = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          deps = set()
          for d in py['project']['dependencies']:
              deps.add(re.split('[<>=; ]', d.strip())[0].lower())
          for extra in ('dev',):
              for d in py['project']['optional-dependencies'][extra]:
                  deps.add(re.split('[<>=; ]', d.strip())[0].lower())
          # browser extra is intentionally NOT in requirements.txt
          for d in py['project']['optional-dependencies'].get('browser', []):
              deps.discard(re.split('[<>=; ]', d.strip())[0].lower())
          # ollama extra is included via dev already
          req_lines = [l.strip() for l in pathlib.Path('requirements.txt').read_text().splitlines() if l.strip() and not l.strip().startswith('#')]
          reqs = set(re.split('[<>=; ]', l)[0].lower() for l in req_lines)
          missing = sorted(deps - reqs)
          assert not missing, f'requirements.txt missing deps from pyproject.toml: {missing}'
          print(f'requirements sync ok: {len(reqs)} reqs cover {len(deps)} pyproject deps')
          "
      - name: Doctor --json machine-readable output check
        run: |
          python main.py --doctor --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'checks' in data and 'is_valid' in data and 'unknown_keys' in data, 'doctor --json missing keys'
          print(f\"doctor --json ok: is_valid={data['is_valid']}, checks={len(data['checks'])}\")
          "
      - name: Docs truth guard (no-args startup)
        run: |
          # Fail if any doc claims the no-args default launches the interactive
          # menu. Truth: `python main.py` with no args starts the WebUI daemon
          # (main.py no-args branch -> _run_daemon); `--menu` is the terminal menu.
          offenders=$(grep -R -n -i -E \
            "interactive menu \(default|menu (is )?the default no-arg|no-args default.*(interactive|questionary) menu|# interactive menu \(default\)" \
            README.md CLAUDE.md AGENTS.md CONTRIBUTING.md docs/ 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "ERROR: stale no-args startup claims found (no-args = WebUI daemon, not the menu):"
            echo "$offenders"
            exit 1
          fi
          echo "Docs truth guard (no-args startup): OK"
      - name: Docs truth audit (links + versions)
        run: python scripts/docs_truth_audit.py
      - name: Version truth (bump --check + versions --check)
        run: |
          python scripts/bump-version.py --check
          python scripts/docs_truth_audit.py --check versions
      - name: Generated docs freshness (schema-derived)
        run: |
          python scripts/generate_config_reference.py --check
          python scripts/generate_safety_defaults.py --check
          python scripts/generate_source_map.py --check
          python scripts/generate_cli_reference.py --check
      - name: Action SHA-pin guard (no mutable tags)
        run: |
          # Fail if any third-party Action is pinned to a mutable tag instead of
          # a full 40-char commit SHA (policy: CONTRIBUTING.md Action pinning).
          # Format: uses: owner/action@<sha> # vX
          offenders=$(grep -R -n -E "uses:[[:space:]]+[^[:space:]#]+@[v0-9][^[:space:]#]*" .github/workflows/ | grep -v -E "@[0-9a-f]{40}" || true)
          if [ -n "$offenders" ]; then
            echo "ERROR: mutable Action tags found (pin to full SHA, see CONTRIBUTING.md):"
            echo "$offenders"
            exit 1
          fi
          echo "Action SHA-pin guard: OK"

  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Debug mypy env
        run: |
          mypy --version
          python --version
          grep -A2 "python_version" pyproject.toml || true
      - name: Mypy check (256 files, permissive)
        run: |
          set -o pipefail
          mypy --follow-imports=skip tools 2>&1 | tee mypy.log
      - name: Upload mypy log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mypy-log
          path: mypy.log
          if-no-files-found: warn
          retention-days: 1
      - name: Mypy strict hot files (zero disables)
        run: mypy --follow-imports=skip tools/validation_utils.py tools/exceptions.py tools/mcp_shared.py
      - name: Mypy strict subsystems (zero disables)
        run: mypy --follow-imports=skip tools/kernel tools/sandbox
      - name: Mypy type-debt gate (no new debt vs baseline)
        run: python scripts/mypy_debt.py
      - name: Mypy debt trend summary
        run: python scripts/mypy_debt.py --trend

  package:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify distributions
        run: python -m twine check dist/*
      - name: Install wheel + import smoke
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import tools.exploit_agent; from tools.exploit_agent import run_exploit_agent; import tools.exploit_agent.runner._impl; print('wheel import smoke: ok')"
      - name: Clean-CWD installed-wheel smoke (no repo checkout)
        run: |
          TMPDIR=$(mktemp -d)
          echo "Testing installed wheel from clean dir: $TMPDIR (no config.yaml, no skills checkout)"
          ls -la "$TMPDIR"
          (cd "$TMPDIR" && breachpilot --doctor --json > doctor.json || true)
          cat "$TMPDIR/doctor.json" || true
          python -c "import textwrap; exec(textwrap.dedent(r\"\"\"
          import json, pathlib, sys
          data = json.loads(pathlib.Path('$TMPDIR/doctor.json').read_text(encoding='utf-8'))
          assert 'checks' in data and 'is_valid' in data, 'doctor json shape'
          print('doctor checks:', [(c['name'], c['ok']) for c in data['checks']])
          \"\"\"))"
          (cd "$TMPDIR" && python - <<'PY'
          import pathlib
          from tools.paths import get_packaged_skills_dir
          pkg = get_packaged_skills_dir()
          assert pkg.is_dir(), f'packaged skills dir missing: {pkg}'
          assert any(pkg.rglob('SKILL.md')), f'no SKILL.md under {pkg}'
          print(f'packaged skills ok: {pkg} ({len(list(pkg.rglob("SKILL.md")))} SKILL.md)')
          from tools.paths import load_effective_config
          cfg = load_effective_config()
          assert 'sandbox' in cfg and cfg['sandbox']['enabled'] is True, f"sandbox.enabled should be True by default, got {cfg.get('sandbox')}"
          assert 'skills' in cfg and cfg['skills']['roots'] == ['skills'], f"skills.roots default {cfg.get('skills')}"
          print(f"effective config defaults ok: sandbox.enabled={cfg['sandbox']['enabled']}")
          from tools.skill_registry_cache import get_registry, clear_cache
          clear_cache()
          reg = get_registry()
          assert len(reg.skills) > 100, f'expected >100 skills from packaged catalog, got {len(reg.skills)}'
          assert not any('root does not exist' in e for e in reg.errors), f'unexpected registry errors: {reg.errors[:3]}'
          print(f'skill registry ok: {len(reg.skills)} skills, {len(reg.errors)} errors')
          from tools.sandbox.models import SandboxConfig
          scfg = SandboxConfig.from_config(cfg)
          assert scfg.enabled is True, 'SandboxConfig should be enabled with effective config'
          print(f'sandbox config ok: enabled={scfg.enabled}')
          import tempfile, yaml, pathlib as pl
          with tempfile.NamedTemporaryFile(mode='w', suffix='.yaml', delete=False) as tf:
              yaml.safe_dump({'sandbox': {'enabled': False}}, tf)
              custom = tf.name
          cfg2 = load_effective_config(custom)
          assert cfg2['sandbox']['enabled'] is False, 'explicit custom config should override default'
          print(f'explicit --config override ok: {custom} -> sandbox.enabled=False')
          pl.Path(custom).unlink(missing_ok=True)
          import tempfile as tf2
          with tf2.TemporaryDirectory() as td:
              td_path = pathlib.Path(td)
              (td_path / 'my_skills' / 'demo').mkdir(parents=True)
              (td_path / 'my_skills' / 'demo' / 'SKILL.md').write_text("---\nname: demo\ntags: [demo]\ndescription: demo\n---\n# Demo\n", encoding='utf-8')
              custom_cfg = {'skills': {'roots': [str(td_path / 'my_skills')]}}
              clear_cache()
              reg2 = get_registry(custom_cfg)
              assert 'demo' in reg2.skills, f'custom skill root not loaded: {list(reg2.skills.keys())[:5]}'
              print(f'explicit skill root ok: {td_path}/my_skills -> demo found')
          print('all clean-CWD wheel checks passed')
          PY
          )
          rm -rf "$TMPDIR"
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  webui:
    name: WebUI build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Clean install
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Unit tests (vitest)
        run: npm run test

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: pip-audit (fail on known vulnerabilities)
        run: |
          python -m pip install pip-audit
          python -m pip_audit --desc --local
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: npm audit (fail on high/critical)
        working-directory: webui
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Verify constraints pins match pyproject ranges
        run: |
          python -c "
          import pathlib, re
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          py = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          reqs = {}
          for d in py['project']['dependencies']:
              reqs[re.split('[<>=; ]', d.strip())[0].lower()] = d.strip()
          for extra in ('ollama', 'dev'):
              for d in py['project']['optional-dependencies'][extra]:
                  reqs.setdefault(re.split('[<>=; ]', d.strip())[0].lower(), d.strip())
          pins = {}
          for line in pathlib.Path('constraints-dev.txt').read_text().splitlines():
              line = line.strip()
              if line and not line.startswith('#') and '==' in line:
                  pins[line.split('==')[0].lower()] = line
          from packaging.requirements import Requirement
          bad = []
          for name, spec in reqs.items():
              if name not in pins:
                  bad.append(f'{name} ({spec}) has no pin in constraints-dev.txt')
                  continue
              pinned_ver = pins[name].split('==')[1].strip()
              try:
                  if not Requirement(spec).specifier.contains(pinned_ver, prereleases=True):
                      bad.append(f'{pins[name]} violates pyproject range {spec!r}')
              except Exception as exc:
                  bad.append(f'{name}: could not check {spec!r} ({exc})')
          assert not bad, 'constraints-dev.txt drift: ' + '; '.join(bad)
          print(f'constraints ok: {len(pins)} pins cover {len(reqs)} declared deps')
          "

  release-truth:
    name: Release truth (install URLs resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install-section URLs must resolve (README)
        run: python3 scripts/check_release_urls.py
      - name: Install-section URLs must resolve (deployment guide)
        run: python3 scripts/check_release_urls.py --file docs/deployment.md --start "## Install (step by step)" --end "### Windows (one-click)"

  ci:
    name: CI success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [tests, sandbox, browser, coverage, lint, types, package, webui, audit, release-truth]
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJson(needs) }}'
          echo "$results" | python -c "
          import json, sys
          needs = json.loads(sys.argv[1])
          failed = [k for k, v in needs.items() if v['result'] != 'success']
          if failed:
              print(f\"CI failed: {failed}\")
              for k, v in needs.items():
                  print(f\"  {k}: {v['result']}\")
              sys.exit(1)
          print('All CI jobs passed')
          " "$results"
