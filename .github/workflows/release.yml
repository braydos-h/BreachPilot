name: Release

# 0.69 beta gate (#80): runs on tags. The gate script decides GO/NO-GO;
# NOTHING publishes on NO-GO. SBOMs + attestations cover #42/#43; digest
# recording covers #44; the image build feeds #55.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  gate:
    name: Beta release gate (GO/NO-GO)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Download eval artifacts (if published by eval workflow)
        uses: actions/download-artifact@9bc31d15879fc494a8df7709958926c1703ff3c2 # v4
        continue-on-error: true
        with:
          name: eval-artifacts
          path: eval-artifacts
      - name: Download sandbox digests (if published by sandbox-image workflow)
        uses: actions/download-artifact@9bc31d15879fc494a8df7709958926c1703ff3c2 # v4
        continue-on-error: true
        with:
          name: sandbox-digests
          path: .
      - name: Fetch branch ruleset (admin-applied; EXTERNAL when absent)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/rulesets > branch-rules.json || rm -f branch-rules.json
          ls -la branch-rules.json worker-digests.txt eval-artifacts 2>&1 || true
      - name: Run release gate
        id: gate
        run: |
          FLAGS=""
          [ -d eval-artifacts ] && FLAGS="$FLAGS --eval-dir eval-artifacts"
          [ -f worker-digests.txt ] && FLAGS="$FLAGS --sandbox-digest-file worker-digests.txt"
          [ -f branch-rules.json ] && FLAGS="$FLAGS --branch-rules-file branch-rules.json"
          echo "gate flags:$FLAGS"
          python scripts/release_gate.py $FLAGS | tee gate.txt
          verdict=$(python scripts/release_gate.py $FLAGS --json | python -c "import json,sys; print(json.load(sys.stdin)['verdict'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          test "$verdict" = "GO"
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate
          path: gate.txt
          retention-days: 90

  build:
    name: Build + SBOM + attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gate]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine cyclonedx-bom
      - name: Build sdist + wheel
        run: python -m build
      - name: SHA256SUMS
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: SBOM (Python, CycloneDX)
        run: python -m cyclonedx_py environment --output-format JSON --output-file sbom-python.json
      - name: SBOM (WebUI, npm)
        working-directory: webui
        run: npm ci && npm sbom --omit=dev --sbom-format=cyclonedx > ../sbom-webui.json
      - name: Resolve sandbox base digest (#44)
        run: docker buildx imagetools inspect debian:12-slim --format '{{json .Manifest}}' | python -c "import json,sys; print(json.load(sys.stdin).get('digest','unknown'))" | tee base-digest.txt
      - name: Build sandbox worker image
        run: docker build -t breachpilot-sandbox:${{ github.ref_name }} docker/sandbox
      - name: Record worker image digest
        run: docker image inspect --format '{{json .RepoDigests}}' breachpilot-sandbox:${{ github.ref_name }} | tee worker-digests.txt
      - name: SBOM (sandbox image, syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: breachpilot-sandbox:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom-sandbox.json
      - name: Scan image (Trivy, HIGH/CRITICAL fail gate)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: breachpilot-sandbox:${{ github.ref_name }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Attest build provenance (#42)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*, sbom-python.json, sbom-webui.json, sbom-sandbox.json
      - name: Freeze versioned installer (TODO 013)
        run: |
          cp install.sh install-${{ github.ref_name }}.sh
          cp install.ps1 install-${{ github.ref_name }}.ps1 2>/dev/null || true
          sha256sum install-${{ github.ref_name }}.sh > install-${{ github.ref_name }}.sh.sha256
          cat install-${{ github.ref_name }}.sh.sha256
      - name: Attest installer provenance (TODO 013)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: install-${{ github.ref_name }}.sh
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/*
            SHA256SUMS
            sbom-python.json
            sbom-webui.json
            sbom-sandbox.json
            base-digest.txt
            worker-digests.txt
            trivy.sarif
            install-*.sh
            install-*.sh.sha256
          retention-days: 90
