name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-native:
    name: Native Go + Rust + WebUI release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Run strict release gate
        run: |
          sh scripts/zero-python-gate.sh --strict
          go run ./cmd/bp-codegen -mode release-gate -strict
      - name: Build native release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/bp-linux-amd64 ./cmd/bp
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/bp-windows-amd64.exe ./cmd/bp
          cargo build --manifest-path rust/Cargo.toml --workspace --release
          cp rust/target/release/bp-sidecar dist/bp-sidecar-linux-amd64
      - name: Build WebUI bundle
        working-directory: webui
        run: npm ci && npm run build
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
