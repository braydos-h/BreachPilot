name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-native:
    name: Native Go + Rust + WebUI release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.24"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Run strict release gate
        run: |
          sh scripts/zero-python-gate.sh --strict
          go run ./cmd/bp-codegen -mode release-gate -strict
      - name: Build native release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/bp-linux-amd64 ./cmd/bp
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/bp-windows-amd64.exe ./cmd/bp
          cargo build --manifest-path rust/Cargo.toml --workspace --release
          cp rust/target/release/bp-sidecar dist/bp-sidecar-linux-amd64
      - name: Build WebUI bundle
        working-directory: webui
        run: npm ci && npm run build
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
