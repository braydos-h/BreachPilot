name: benchmark

on:
  push:
    branches: [main]
    paths:
      - "internal/bench/**"
      - "cmd/bp/**"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "internal/bench/**"
      - "cmd/bp/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark-native:
    name: Native Go benchmark + smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.24"
          cache: true
      - run: go test ./internal/bench/... -v -count=1
      - run: go run ./cmd/bp --eval --trials 1 --save-baseline
      - run: go run ./cmd/bp --eval --trials 1 --check-regression
