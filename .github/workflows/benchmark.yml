name: benchmark

on:
  push:
    branches: [main]
    paths:
      - "internal/bench/**"
      - "cmd/bp/**"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "internal/bench/**"
      - "cmd/bp/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark-native:
    name: Native Go benchmark + smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.24"
          cache: true
      - run: go test ./internal/bench/... -v -count=1
      - run: go run ./cmd/bp --eval --trials 1 --save-baseline
      - run: go run ./cmd/bp --eval --trials 1 --check-regression
