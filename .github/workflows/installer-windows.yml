name: Windows installer

on:
  push:
    paths:
      - "install.ps1"
      - "install.bat"
      - "START.bat"
      - ".github/workflows/installer-windows.yml"
  pull_request:
    paths:
      - "install.ps1"
      - "install.bat"
      - "START.bat"
      - ".github/workflows/installer-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate install.ps1 and install.bat (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Parser check
        shell: powershell
        run: |
          $errs = $null; $toks = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/install.ps1", [ref]$toks, [ref]$errs)
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host "L$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "Parser: OK"
      - name: Check mode smoke
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Help
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Check
