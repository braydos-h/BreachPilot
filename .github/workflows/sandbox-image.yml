name: Sandbox image

on:
  push:
    tags:
      - "v*"
    paths:
      - "docker/sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-worker:
    name: Build sandbox worker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build base worker image
        run: docker build -t breachpilot-sandbox:latest docker/sandbox
      - name: Build browser worker image
        run: docker build --build-arg BASE_IMAGE=breachpilot-sandbox:latest -t breachpilot-sandbox:browser -f docker/sandbox/Dockerfile.browser docker/sandbox
