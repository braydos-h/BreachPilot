name: Sandbox image

# Prebuilt disposable-worker images (#55). Builds on release tags (and weekly
# to catch base-image drift), pushes versioned + major-floating tags to GHCR,
# signs keyless with cosign (GitHub OIDC, no maintainer keys), and records
# digests as the workflow artifact. Until the first push lands, the release
# gate keeps `sandbox-image-published` EXTERNAL.
#
# One-time maintainer setup: GHCR publishing to an org/user namespace works
# with the default GITHUB_TOKEN (packages: write). No secret to create.

on:
  push:
    tags:
      - "v*"
    paths:
      - "docker/sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/breachpilot-sandbox

jobs:
  build-push-sign:
    name: Build, push, sign worker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=nightly" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build + push base worker
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/sandbox
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build + push browser worker
        id: browser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/sandbox
          file: docker/sandbox/Dockerfile.browser
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}-browser
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign images (keyless, GitHub OIDC)
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.base.outputs.digest }}"
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.browser.outputs.digest }}"
      - name: Record digests
        run: |
          {
            echo "# Sandbox image digests (${{ steps.tags.outputs.version }})"
            echo ""
            echo "- base: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.base.outputs.digest }}\`"
            echo "- browser: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.browser.outputs.digest }}\`"
            echo ""
            echo "Verify: \`cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@<digest> --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } | tee DIGESTS.md
      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-digests
          path: DIGESTS.md
          retention-days: 90
