name: ci-native

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go fmt ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/allowlist ./internal/events ./internal/config
      - run: CGO_ENABLED=0 go build -o bp ./cmd/bp

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        working-directory: rust
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --workspace
        working-directory: rust
      - run: cargo build --workspace --release
        working-directory: rust

  ipc-contract:
    runs-on: ubuntu-latest
    needs: [go, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sidecar and run IPC health + allowlist vector check
        run: |
          cargo build --bin bp-sidecar --release
          BP_SIDECAR_ADDR=127.0.0.1:18765 ./target/release/bp-sidecar &
          SIDECAR_PID=$!
          sleep 1
          go test ./internal/ipc/ -run TestVectors -v
          kill $SIDECAR_PID
        working-directory: rust

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  docker:
    runs-on: ubuntu-latest
    needs: [go, rust, webui]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.native -t breachpilot-native:ci .
