name: ci-native

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.24"
          cache: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o bp ./cmd/bp

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        working-directory: rust
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --workspace
        working-directory: rust
      - run: cargo build --workspace --release
        working-directory: rust

  ipc-contract:
    runs-on: ubuntu-latest
    needs: [go, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.24"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sidecar
        run: cargo build --bin bp-sidecar --release
        working-directory: rust
      - name: Live Go-Rust IPC contract tests
        run: |
          BP_SIDECAR_ADDR=127.0.0.1:18765 ./rust/target/release/bp-sidecar &
          SIDECAR_PID=$!
          sleep 1
          go test ./internal/ipc/ -v -count=1
          STATUS=$?
          kill $SIDECAR_PID
          exit $STATUS

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  zero-python-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.24"
      - run: sh scripts/zero-python-gate.sh --strict
      - run: go test ./internal/zeropython/ -count=1
      - run: go run ./cmd/bp-codegen -mode release-gate -strict

  docker:
    runs-on: ubuntu-latest
    needs: [go, rust, webui, zero-python-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - run: docker build -f Dockerfile.native -t breachpilot-native:ci .
      - run: docker build -t breachpilot-sandbox:latest docker/sandbox
