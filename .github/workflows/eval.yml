name: Eval

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "internal/bench/**"
      - "eval_targets/**"
      - ".github/workflows/eval.yml"
  pull_request:

permissions:
  contents: read

jobs:
  eval-native:
    name: Native graded oracle + eval tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.24"
          cache: true
      - run: go test ./internal/bench/... -v -count=1
      - run: go run ./cmd/bp --eval-list
      - run: go run ./cmd/bp --eval --trials 1
