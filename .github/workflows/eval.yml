name: Eval

# Graded eval loop (oracle v2). The unit-test job is fully mocked and runs on
# push/PR touching eval code; the live nightly-eval job needs real targets
# (docker compose suite) + a model backend (Ollama Cloud), so it only runs on
# schedule or manual dispatch. A missing backend is recorded as an explicit
# SKIPPED report (live_outcome=SKIPPED) — never as a green PASS.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      baseline_mode:
        description: "Use the existing baseline or initialize it from this full-suite run"
        type: choice
        options:
          - check
          - initialize
        default: check
        required: true
  push:
    paths:
      - "tools/eval/**"
      - "tools/eval_harness.py"
      - "tools/eval_checks.py"
      - "eval_targets/**"
      - "tests/test_eval_*.py"
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  eval-unit:
    name: Eval unit tests (mocked, no API key)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run eval unit tests (all mocked)
        run: python -m pytest tests/test_eval_harness.py tests/test_eval_suite.py tests/test_eval_cli.py tests/test_eval_live_outcome.py tests/test_eval_provenance.py tests/test_benchmark_metrics.py -v

  nightly-eval:
    name: Nightly graded eval (live targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    env:
      EXPLOIT_ALLOWED_TARGETS: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Check whether live eval credentials are configured
        id: credentials
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [[ -n "$OLLAMA_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Record explicit SKIPPED report without OLLAMA_API_KEY
        if: steps.credentials.outputs.available != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -c "from tools.eval_harness import write_skipped_eval_report; print(write_skipped_eval_report('reports/eval', reason='OLLAMA_API_KEY not set; live graded eval skipped with zero live signal'))"
          {
            echo "## Nightly graded eval — SKIPPED"
            echo ""
            echo "Live outcome: \`SKIPPED\` (OLLAMA_API_KEY not set; zero live targets executed)."
            echo "This is not a green evaluation — no PASS/FAIL signal was produced."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OLLAMA_API_KEY not set; wrote SKIPPED eval report (see artifact)."
      - name: Install project + dev dependencies
        if: steps.credentials.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Restore the latest successful eval baseline
        id: baseline
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_mode || 'check' }}
        run: |
          mkdir -p reports/eval
          if [[ "$BASELINE_MODE" == "initialize" ]]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Baseline initialization requested; this run will establish the trusted baseline."
            exit 0
          fi
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            candidate_dir="$(mktemp -d)"
            if gh run download "$run_id" --name eval-reports --dir "$candidate_dir" >/dev/null 2>&1; then
              baseline_file="$(find "$candidate_dir" -type f -name baseline.json -print -quit)"
              if [[ -n "$baseline_file" ]]; then
                cp "$baseline_file" reports/eval/baseline.json
                echo "restored=true" >> "$GITHUB_OUTPUT"
                echo "Restored baseline from successful eval run $run_id."
                exit 0
              fi
            fi
            rm -rf "$candidate_dir"
          done < <(gh run list --workflow eval.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId')
          echo "restored=false" >> "$GITHUB_OUTPUT"
          echo "No prior successful eval artifact contains a baseline; the regression gate will fail closed."
      - name: Start eval target suite (docker compose)
        if: steps.credentials.outputs.available == 'true'
        run: docker compose -f eval_targets/docker-compose.yml up -d
      - name: Build required sandbox worker image
        if: steps.credentials.outputs.available == 'true'
        run: docker build -t breachpilot-sandbox:latest docker/sandbox
      - name: Run graded eval and regression gate
        if: steps.credentials.outputs.available == 'true'
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          BASELINE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_mode || 'check' }}
        run: |
          if [[ "$BASELINE_MODE" == "initialize" ]]; then
            python main.py --eval --save-baseline
          else
            python main.py --eval --save-baseline --check-regression
          fi
      - name: Single-trial XBEN lab smoke (host targets do not support automatic reset)
        if: steps.credentials.outputs.available == 'true'
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: python main.py --benchmark xben --trials 1
      - name: Stop eval target suite
        if: always() && steps.credentials.outputs.available == 'true'
        run: docker compose -f eval_targets/docker-compose.yml down
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-reports
          path: reports/eval/
          if-no-files-found: error
          retention-days: 14
      - name: Upload benchmark reports (incl. provenance digests)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-reports
          path: reports/benchmarks/
          if-no-files-found: warn
          retention-days: 14
