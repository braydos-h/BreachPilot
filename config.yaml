ollama:
  host: http://localhost:11434
  model: glm-5.2:cloud
models:
  registry:
    kimi: kimi-k2.6:cloud
    deepseek: deepseek-v4-pro:cloud
    deepseek_flash: deepseek-v4-flash:cloud
    glm: glm-5.2:cloud
    minimax: minimax-m3:cloud
  default_alias: glm
  info:
    kimi:
      label: Kimi K2.6
      context_window: 256000
      description: "Moonshot Kimi K2.6 \u2014 strong long-form reasoning, 256K context."
    deepseek:
      label: DeepSeek V4 Pro
      context_window: 1000000
      description: "DeepSeek V4 Pro \u2014 1M token context, deep code reasoning."
    deepseek_flash:
      label: DeepSeek V4 Flash
      context_window: 1000000
      description: "DeepSeek V4 Flash - 1M token context, fast DeepSeek option for lower-latency work."
    glm:
      label: GLM-5.2
      context_window: 976000
      description: "Zhipu GLM-5.2 \u2014 976K context, the smartest/newest GLM for\
        \ deep reasoning + coding."
    minimax:
      label: Minimax M3
      context_window: 512000
      description: "Minimax M3 (cloud) \u2014 512K context, balanced coding + reasoning."
mcp:
  default_transport: stdio
# Linux-friendly nmap invocation. `path` overrides the binary when nmap is not
# on PATH; `sudo` runs nmap via `sudo -n` so root-only scans (-O, -sS) work
# from a non-root shell; `priv_fallback` auto-downgrades those flags instead of
# failing when unprivileged and sudo is off. No-op on Windows.
nmap:
  path: nmap
  sudo: false
  priv_fallback: true
exploit:
  enabled: true
  mode: standalone
  # LAB BUILD: attack mode is unrestricted. Default full_access + attack_mode
  # auto-approves every action; the only remaining gate is the target-IP lock
  # (require_explicit_allowlist unions the runtime --target via EXPLOIT_TARGET
  # env, see tools/mcp_shared._check_allowlist). Recon mode keeps its own
  # safety (read_only propose-only, post-session SafetyReviewer) — recon never
  # enters the full_access auto-approve branch. Operator-box filesystem is
  # unrestricted (no workspace path-traversal protection) — only run this on a
  # throwaway lab VM.
  permission: full_access
  attack_mode: true
  terminal: visible
  command_timeout_seconds: 300
  max_commands_per_session: 9999
  max_rounds: 200
  attack_max_commands: 150
  attack_max_rounds: 50
  attack_max_duration_minutes: 360
  context_summarize_every: 50
  auto_post_exploit: true
  max_pivot_depth: 2
  workspace_dir: exploit_workspace
  loot_workspace: exploit_workspace/loot
  attacker_os: auto
  searchsploit_path: searchsploit
  # Linux: shell used by run_exploit_terminal (default bash; cmd.exe on Windows).
  # msfconsole_path overrides the Metasploit console binary when not on PATH.
  shell: bash
  msfconsole_path: msfconsole
  web_search: true
  max_query_chars: 200
  cache_ttl_seconds: 3600
  cache_max_entries: 50
  require_explicit_allowlist: true
  # IPs entered through Start New Session are saved here automatically. The
  # runtime --target is also injected via EXPLOIT_TARGET and unioned at check
  # time (tools/mcp_shared._check_allowlist). Add extra operator-authorized
  # hosts here (e.g. a callback/C2 listener) to permit them as well.
  allowed_targets:
    - 127.0.0.1
  # H10: Flow A (exploit engine) reads its scope rules HERE, not from
  # mission.yaml (which is Flow B's config). Previously these keys were absent,
  # so _build_exploit_scope_gate in main.py always passed empty lists and the
  # mission deny/forbidden rules never applied on the full_access auto-approve
  # path. Listed categories are matched against the tool->action-category map in
  # tools/exploit_agent.py::_TOOL_ACTION_CATEGORY. Defaults are intentionally
  # empty: the hard-forbidden actions (denial_of_service, destructive_exploit,
  # social_engineering, physical_attack, malware) are already always blocked by
  # scope_gate._HARD_FORBIDDEN_ACTIONS, and the exploit engine's offensive tools
  # (dump_credentials, lateral_exec, ...) are available in full_access by
  # design. Add a category here to opt OUT of it, e.g.:
  #   forbidden_actions: ["credential_dumping", "lateral_movement"]
  disallowed_assets: []
  forbidden_actions: []
  # Active Directory / Kerberos post-exploit suite (Phase 1). Opt-in: the
  # master `enabled` AND the per-tool flag must both be true, or the tool
  # returns BLOCKED: ... disabled before the allowlist gate. smb_signing_check
  # is detection-only and defaults ON. Every tool is target-IP-locked
  # (@require_allowlist + check_targets_allowlist for any off-target DC).
  ad_kerberos:
    enabled: false
    asrep_roast: false
    pass_the_hash: false
    adcs_enum: false
    bloodhound: false
    responder_relay: false
    golden_ticket: false
    smb_signing_check: true   # detection-only
stealth:
  rotate_ua: false
  dns_over_https: false
  doh_provider: cloudflare
cve_lookup:
  enabled: true
  max_results: 5
  rate_limit_seconds: 6.0
  timeout_seconds: 30
  cache_ttl_seconds: 3600
  cache_max_entries: 100
  api_key_env: NVD_API_KEY
  circuit_failure_threshold: 5
  circuit_recovery_timeout: 60.0
  search_rate_limit_per_minute: 10
  # GitHub Search API token for cve_to_poc (optional). Absent = unauth 60/hr
  # rate limit; cve_to_poc still works (falls through to searchsploit/NVD).
  github:
    token_env: GITHUB_TOKEN
research:
  enabled: true
  provider: ollama
  fallback_provider: serpapi
  timeout_seconds: 15
  max_results: 8
  max_fetch_depth: 5
  max_content_chars: 12000
  cache_ttl_seconds: 1800
  cache_max_entries: 250
  min_source_quality: medium
  require_api_key_for_mcp_tools: true
  allow_local_fetch: false
  ollama:
    api_key_env: OLLAMA_API_KEY
    max_results: 8
    use_web_search: true
    use_web_fetch: true
  serpapi:
    api_key_env: SERPAPI_API_KEY
    endpoint: https://serpapi.com/search.json
    engine: duckduckgo
    region: us-en
swarm:
  enabled: true
  agents:
  - recon
  - vuln
  - exploit
  - post_exploit
  - critic
  - reflection
  max_parallel_agents: 3

# Autonomous orchestrator Phase 2 capabilities — opt-in. All keys default OFF / 0
# so default behavior is unchanged; the new attack-path capabilities must be
# explicitly enabled per the CLAUDE.md opt-in rule. The orchestrator reads these
# from mission_config, not ExploitSettings.
autonomous:
  persistence_phase: false        # Phase 2.2: run PERSISTENCE phase after access achieved
  checkpoint_every: 0             # Phase 2.3: save attack_states.json every N completed targets (0 = off)
  adaptive_replan: false          # Phase 2.4: per-target multi-round replan + vuln-chaining
  max_cycles: 100                 # round cap when adaptive_replan is on
  max_pivot_depth: 0              # already consumed by the orchestrator (single-IP lock default)

# Recon coverage & depth (Phase 3). Gates the additive enumerators (TLS/SSL
# cert parse, SMTP/DB banner parse, web spider, passive OSINT + IPv6 AAAA
# lookup) and the UDP top-ports scan. The TCP scan_host path is unchanged
# regardless. IPv6 stays PASSIVE-ONLY (AAAA lookup) -- the target-IP allowlist
# lock is untouched.
recon:
  extended_enumerators: true      # enable TLS/SMTP/DB/spider/OSINT additive enumerators
  udp_top_ports: 100              # nmap -sU --top-ports N for run_udp_recon / recon_udp
  shodan_api_key: ""              # optional Shodan key for passive OSINT; "" = disabled (falls back to $SHODAN_API_KEY)
  # Extended depth enumerators (Phase 2). Default OFF; each independently gated.
  subdomain_enum: false
  vhost_discovery: false
  waf_fingerprint: false
  asn_whois: false
  cloud_metadata_probe: false
  snmp_enum: false
  dns_zone_transfer: false

# OPSEC / detection-evasion (Phase 6.2). The agent's OWN operational hardening
# (pacing/jitter/UA-rotation/DNS-over-HTTPS/quiet-commands) so an authorized
# assessment can simulate a low-noise adversary, plus detection-coverage testing
# (canary probes + read-only footprint summary). NOT active evasion of the
# target's defenses -- no log-clearing/timestomping/EDR defeat; the append-only
# tamper-evident audit chain is untouched. Defaults OFF (opt-in); when enabled,
# AggressionLevel.STEALTH becomes load-bearing.
opsec:
  enabled: false                  # master switch (opt-in)
  ua_rotation: false              # rotate User-Agent across HTTP egress
  doh: false                      # resolve via DNS-over-HTTPS
  doh_provider: cloudflare        # cloudflare | google
  min_gap_seconds: 0.0            # base pacing gap between actions
  jitter_seconds: 0.0             # +/- random jitter on the gap
  rate_per_minute: 0              # 0 = no token-bucket cap
  quiet_command_patterns: []      # substrings to refuse when enabled
  noise_budget: 0                 # max noisy commands allowed (0 = unlimited)
  # Target-aware OPSEC: private/local target IPs (RFC1918/loopback/link-local/
  # reserved/ULA, or anything in local_cidrs) -> OPSEC forced OFF; the operator
  # owns the box so the AI moves freely with no pacing/UA-rotation/quiet-block.
  # Public-routable targets keep OPSEC ON (pacing/UA/quiet-commands) and the AI
  # retains full attack autonomy (public_autonomy). Default true.
  local_targets_off: true         # local/private target -> OPSEC off; public -> on
  local_cidrs: []                 # extra CIDRs/IPs treated as local (e.g. ["10.99.0.0/16"])
  public_autonomy: true           # public target -> AI chooses its own attacks

# Eval/benchmark harness config. The --eval CLI flag still works when
# ``enabled`` is false, but this block gates the defaults used by the eval
# runner (output location, round budget, report formats).
eval:
  enabled: true                   # eval/benchmark harness enable (the --eval flag still works when false, but the config gates defaults)
  output_dir: reports/eval        # where reports/eval/<run_id>/ trees are written
  max_rounds: 30                  # attack_max_rounds for an eval run
  write_markdown: true            # emit eval_report.md alongside the JSON
  write_html: true                # emit eval_report.html alongside the JSON

# Long-session mode — opt-in via ``--long-session`` flag or ``enabled: true``.
# Lets a multi-hour attack run actually sustain itself: sends the model's real
# context window (num_ctx) to Ollama, bounds each LLM call with an httpx
# timeout, raises the round/command/duration budgets, lifts the 300s swarm cap,
# and checkpoints the compacted conversation so a crashed run resumes with real
# context instead of a 300-char-condensed snippet. Absent/false = current
# behavior; first-run defaults are unchanged.
long_session:
  enabled: false
  request_timeout_seconds: 600        # per-LLM-call httpx timeout (bounds hung generations)
  swarm_session_timeout_minutes: 30   # overrides the 300s swarm cap when long-session active
  attack_max_rounds: 200
  attack_max_commands: 1000
  attack_max_duration_minutes: 720    # 12h wall clock
  persist_messages: true             # checkpoint compacted messages to session_state.json
reasoning:
  chain_of_thought: true
  reflection_every_n_actions: 10
  critic_enabled: true
  observer_mode: hybrid
  ultrathink: false
  ultrathink_reflection_interval: 3
  # LLM-driven reflection inside run_exploit_agent (Phase 1b). Default off so
  # the hot loop makes no extra LLM calls unless explicitly opted in. When off,
  # the heuristic _generate_reflection is used. Advisory-only; never feeds the
  # Bayesian ExperienceStore.
  llm_reflection: false
  # Phase 1c: auto-trigger consult_peer_models after N consecutive exploit
  # failures (in-process, advisory-only — peers have no tool schemas). 0
  # disables the auto-consult (manual consult_peer_models still works). The
  # shared per-run max_consultations budget (multi_model.max_consultations) is
  # honored via the single _consultation_count counter. No effect when
  # multi_model.enabled is false or permission is read_only (nothing executes).
  peer_consult_on_failure_threshold: 3
memory:
  semantic_enabled: true
  embedding_model: nomic-embed-text
  cross_mission_learning: true
  attack_memory_enabled: true
  attack_memory_max_context_chars: 6000
  experience_min_samples: 3
  experience_time_decay_days: 90
outcome_judgment:
  # Only materially different checks count. At least 2 prevents one failed
  # command from exhausting a hypothesis.
  max_inconclusive_attempts: 3
  confirmation_threshold: 0.75
  refutation_threshold: 0.75
  min_evidence_references: 1
  # Phase 1.2: wire OutcomeJudge into Flow A (exploit engine). Default OFF --
  # first-run behavior is unchanged (shallow exit_code==0 success). When true,
  # the exploit loop runs classify_exploit_result + OutcomeJudge.judge and uses
  # the evidence-grounded HypothesisStatus to override the success flag.
  flow_a: false
adaptive_exploits:
  enabled: true
  max_mutations: 5
  mutation_strategies:
  - parameter_tweak
  - encoding_change
  - delivery_swap
  - context_aware
multi_model:
  enabled: true
  consult_aliases:
  - kimi
  - deepseek
  - deepseek_flash
  - glm
  - minimax
  max_consultations: 10
  max_question_chars: 4000
  max_answer_chars: 8000
skills:
  enabled: true
  roots:
  - skills-to-add
  default_enabled:
  - scanning-network-with-nmap-advanced
  - conducting-network-penetration-test
  - executing-red-team-engagement-planning
  - auditing-mcp-servers-for-tool-poisoning
  - securing-agentic-ai-tool-invocation
  include_tags: []
  exclude_names: []
  maybe_enabled: false
  allow_model_lookup: true
  inject_startup_context: false
  max_active_skills: 6
  max_chars_per_skill: 2500
  max_total_chars: 9000
  min_contextual_skills: 3
  default_skill_weight: 12
  context_skill_weight: 24
  reselect_mid_run: true
  reselect_max_per_run: 3
  reselect_min_interval_actions: 5
  reselect_sticky_defaults: true
  swarm_inject: true
  swarm_phase_hints_only: true
  feedback_enabled: true
  feedback_skill_weight: 8
  feedback_min_observations: 3
  semantic_matching: true
  semantic_skill_weight: 16
  semantic_min_similarity: 0.35
  semantic_model: nomic-embed-text
  diversity_penalty: 12
  include_metadata: false
  allow_reference_listing: true
