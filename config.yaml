# NetAttackAI by @braydos-h — https://github.com/braydos-h/NetAttackAi
ollama:
  host: https://api.ollama.com
  model: glm-5.2:cloud
  api_key_env: OLLAMA_API_KEY
  embed_host: http://localhost:11434
models:
  provider: ollama
  registry:
    kimi: kimi-k2.6:cloud
    deepseek: deepseek-v4-pro:cloud
    deepseek_flash: deepseek-v4-flash:cloud
    glm: glm-5.2:cloud
    minimax: minimax-m3:cloud
  default_alias: glm
  # Model-role routing: each role maps to an alias; empty = default_alias.
  # Consumed by tools/model_router.py::get_client_for_role.
  roles:
    planner: ''
    executor: ''
    interpreter: ''
    code_generator: ''
    critic: ''
    summarizer: ''
  info:
    kimi:
      label: Kimi K2.6
      context_window: 256000
      description: Moonshot Kimi K2.6 — strong long-form reasoning, 256K context.
    deepseek:
      label: DeepSeek V4 Pro
      context_window: 1000000
      description: DeepSeek V4 Pro — 1M token context, deep code reasoning.
    deepseek_flash:
      label: DeepSeek V4 Flash
      context_window: 1000000
      description: DeepSeek V4 Flash - 1M token context, fast DeepSeek option for
        lower-latency work.
    glm:
      label: GLM-5.2
      context_window: 976000
      description: Zhipu GLM-5.2 — 976K context, the smartest/newest GLM for deep
        reasoning + coding.
    minimax:
      label: Minimax M3
      context_window: 512000
      description: Minimax M3 (cloud) — 512K context, balanced coding + reasoning.
mcp:
  default_transport: stdio
engine_mcp:
  enabled: true
  host: 127.0.0.1
  port: 8002
nmap:
  path: nmap
  sudo: false
  priv_fallback: true
exploit:
  enabled: true
  mode: standalone
  permission: full_access
  attack_mode: true
  terminal: visible
  command_timeout_seconds: 300
  max_commands_per_session: 9999
  max_rounds: 200
  attack_max_commands: 150
  attack_max_rounds: 50
  attack_max_duration_minutes: 360
  context_summarize_every: 50
  auto_post_exploit: true
  max_pivot_depth: 2
  workspace_dir: exploit_workspace
  loot_workspace: exploit_workspace/loot
  attacker_os: auto
  searchsploit_path: searchsploit
  shell: bash
  msfconsole_path: msfconsole
  web_search: true
  max_query_chars: 200
  cache_ttl_seconds: 3600
  cache_max_entries: 50
  require_explicit_allowlist: true
  allowed_targets:
  - 127.0.0.1
  disallowed_assets: []
  forbidden_actions: []
  ad_kerberos:
    enabled: false
    asrep_roast: false
    pass_the_hash: false
    adcs_enum: false
    bloodhound: false
    responder_relay: false
    golden_ticket: false
    smb_signing_check: true
  msf:
    recipes_enabled: false
    auto_local_exploit_suggester: false
  listeners:
    tls: false
    dns: false
    https_beacon: false
    socks_pivot: false
stealth:
  rotate_ua: false
  dns_over_https: false
  doh_provider: cloudflare
cve_lookup:
  enabled: true
  max_results: 5
  rate_limit_seconds: 6.0
  timeout_seconds: 30
  cache_ttl_seconds: 3600
  cache_max_entries: 100
  api_key_env: NVD_API_KEY
  circuit_failure_threshold: 5
  circuit_recovery_timeout: 60.0
  search_rate_limit_per_minute: 10
  epss_enabled: true
  kev_enabled: true
  kev_cache_ttl_seconds: 86400
  kev_cache_path: ''
  github:
    token_env: GITHUB_TOKEN
threat_intel:
  enabled: true
  cache_dir: exploit_workspace/.threat_intel
  cache_ttl_seconds: 86400
  sources:
    osv: true
    ghsa: true
    kev: true
    exploitdb_rss: false
  max_results: 20
  github_token_env: GITHUB_TOKEN
  timeout_seconds: 30
research:
  enabled: true
  provider: ollama
  fallback_provider: serpapi
  timeout_seconds: 15
  max_results: 8
  max_fetch_depth: 5
  max_content_chars: 12000
  cache_ttl_seconds: 1800
  cache_max_entries: 250
  min_source_quality: medium
  require_api_key_for_mcp_tools: true
  allow_local_fetch: false
  ollama:
    api_key_env: OLLAMA_API_KEY
    max_results: 8
    use_web_search: true
    use_web_fetch: true
  serpapi:
    api_key_env: SERPAPI_API_KEY
    endpoint: https://serpapi.com/search.json
    engine: duckduckgo
    region: us-en
  assistant:
    enabled: true
    model_alias: ''
    automatic: true
    failure_trigger: 2
    max_auto_consultations: 4
    max_tool_calls_per_consultation: 5
    max_model_rounds: 3
    max_advisory_chars: 4000
    timeout_seconds: 90
    save_advisories: true
swarm:
  enabled: true
  agents:
  - recon
  - vuln
  - exploit
  - post_exploit
  - critic
  - reflection
  max_parallel_agents: 3
  parallel_enabled: false
  per_phase_concurrency: 3
  exploit_parallel: false
  subagent_timeout_seconds: 600
  negotiation_rounds: 2
witness:
  enabled: true
  log_path: reports/witness.jsonl
  poll_interval_seconds: 5
  escalate_to_event_broker: true
  max_flags_per_signal_per_minute: 10
  dos_failure_window_seconds: 60.0
  dos_failure_threshold: 8
autonomous:
  persistence_phase: false
  checkpoint_every: 0
  adaptive_replan: false
  max_cycles: 100
  max_pivot_depth: 0
  # Phase 5: campaign-entry preflight (all opt-in, default off).
  # dedup_targets: collapse duplicate IPs / CIDR overlap / hosts resolving
  #   to the same IP before any scan fires.
  # skip_non_routable: drop RFC1918/link-local/reserved addresses that are
  #   not the operator's own host (those use the local-takeover playbook).
  # hard_target_max_rounds: give up on a target after this many adaptive
  #   rounds with no access achieved (0 = off, current behavior).
  dedup_targets: false
  skip_non_routable: false
  hard_target_max_rounds: 0
orchestrator:
  # D1: cross-mission semantic-memory consumer. When true, the autonomous
  # orchestrator builds a SemanticMemoryManager (from the ``memory`` config
  # block's embed_host/embedding_model) and calls store_lesson on every
  # confirmed module win so the campaign learns across missions. Lab default
  # is ON (matches ``memory.semantic_enabled: true`` — the orchestrator is the
  # missing campaign-level consumer of an already-on capability). Advisory-only
  # — read-only memory store consumer, no execution authority change.
  semantic_memory: true
recon:
  extended_enumerators: true
  udp_top_ports: 100
  shodan_api_key: ''
  # Phase 5: pre-flight reachability probe (opt-in, default off). When true,
  # recon_host runs a couple of bare TCP connects before the full Nmap -p-
  # scan and bails to no_attack_surface when every probe port is definitively
  # refused. Ambiguous (timeout/filtered) results fall through to the full
  # scan so a firewalled-but-live host is never skipped.
  preflight_probe: false
  preflight_ports: [80, 443]
  preflight_timeout_ms: 1000
  # Nmap retry budget. On Windows, nmap -sS/-O can hang on Npcap driver
  # issues; set max_retries: 0 to skip straight to the native Python socket
  # fallback instead of burning ~45s on 3 retries with 5-7.5s backoff.
  max_retries: 2
  retry_delay: 5.0
  timeout_seconds: 300
  domain_resolution:
    enabled: true
    max_subdomains: 500
    subdomain_sources:
    - crt_sh
    - dns_bruteforce
    - subfinder
    - amass
    dns_zone_transfer: false
    whois_enabled: true
  subdomain_enum: false
  vhost_discovery: false
  waf_fingerprint: false
  asn_whois: false
  cloud_metadata_probe: false
  snmp_enum: false
  dns_zone_transfer: false
  fast:
    enabled: true
    max_concurrency: 8
    service_concurrency: 6
    cve_concurrency: 8
    per_task_timeout_seconds: 60
    overall_timeout_seconds: 180
    tcp_discovery: true
    udp_top_ports: 50
    passive_osint: true
    service_enumeration: true
    cve_lookup: true
    cache_ttl_seconds: 300
opsec:
  enabled: false
  ua_rotation: false
  doh: false
  doh_provider: cloudflare
  min_gap_seconds: 0.0
  jitter_seconds: 0.0
  rate_per_minute: 0
  quiet_command_patterns: []
  noise_budget: 0
  local_targets_off: true
  local_cidrs: []
  public_autonomy: true
eval:
  enabled: true
  output_dir: reports/eval
  max_rounds: 30
  write_markdown: true
  write_html: true
long_session:
  enabled: true
  request_timeout_seconds: 600
  swarm_session_timeout_minutes: 30
  attack_max_rounds: 200
  attack_max_commands: 1000
  attack_max_duration_minutes: 720
  persist_messages: true
reasoning:
  chain_of_thought: true
  reflection_every_n_actions: 10
  critic_enabled: true
  observer_mode: hybrid
  ultrathink: true
  ultrathink_reflection_interval: 3
  llm_reflection: true
  peer_consult_on_failure_threshold: 3
memory:
  semantic_enabled: true
  embedding_model: nomic-embed-text
  cross_mission_learning: true
  attack_memory_enabled: true
  attack_memory_max_context_chars: 6000
  experience_min_samples: 3
  experience_time_decay_days: 90
outcome_judgment:
  max_inconclusive_attempts: 3
  confirmation_threshold: 0.75
  refutation_threshold: 0.75
  min_evidence_references: 1
  flow_a: true
  peer_review: true
poc_verification:
  enabled: true
  docker_image: python:3.11-slim
  compile_timeout_seconds: 30
  max_retries: 3
  docker_network: none
  docker_read_only: true
  docker_memory: 256m
replay_simulator:
  enabled: true
adaptive_exploits:
  enabled: true
  max_mutations: 5
  mutation_strategies:
  - parameter_tweak
  - encoding_change
  - delivery_swap
  - context_aware
multi_model:
  enabled: true
  consult_aliases:
  - kimi
  - deepseek
  - deepseek_flash
  - glm
  - minimax
  max_consultations: 10
  max_question_chars: 4000
  max_answer_chars: 8000
skills:
  enabled: true
  roots:
  - skills
  default_enabled:
  - scanning-network-with-nmap-advanced
  - conducting-network-penetration-test
  - executing-red-team-engagement-planning
  - auditing-mcp-servers-for-tool-poisoning
  - securing-agentic-ai-tool-invocation
  - attacking-domains-end-to-end
  include_tags: []
  exclude_names: []
  maybe_enabled: false
  allow_model_lookup: true
  inject_startup_context: false
  max_active_skills: 6
  max_chars_per_skill: 2500
  max_total_chars: 9000
  min_contextual_skills: 3
  default_skill_weight: 12
  context_skill_weight: 24
  reselect_mid_run: true
  reselect_max_per_run: 3
  reselect_min_interval_actions: 5
  reselect_sticky_defaults: true
  swarm_inject: true
  swarm_phase_hints_only: true
  feedback_enabled: true
  feedback_skill_weight: 8
  feedback_min_observations: 3
  semantic_matching: true
  semantic_skill_weight: 16
  semantic_min_similarity: 0.35
  semantic_model: nomic-embed-text
  diversity_penalty: 12
  include_metadata: false
  allow_reference_listing: true
api:
  enabled: true
  host: 127.0.0.1
  port: 8765
  token_file: .webui_secret_key
  allowed_origins: []
  event_buffer_size: 256
  shutdown_timeout_seconds: 15
  serve_webui: true
  # Phase 6.3 (D3): lift the one-active-run limit to N concurrent runs for
  # authorized wide-scope assessments. Default 1 = legacy single-run behavior
  # (HTTP 409 on a second run). Each concurrent run carries its own allowlist
  # snapshot so Run A's target never leaks into Run B's allowlist.
  max_concurrent_runs: 3
  # Phase 6.3 (D4): multi-operator user accounts + per-run annotations for
  # pair-testing collaboration. Default false = legacy single-token mode (no
  # user-account surface). Auth is loopback-only; user accounts add attribution,
  # not a permissions system.
  multi_operator: true
  # D3: attack-path DAG API route (GET /api/v1/runs/{id}/graph). Lab build:
  # enabled true so the interactive reactflow graph renders in the WebUI.
  graph_route: true
# Phase 6.3 (D8): ICS write-side modules (ModbusWriteCoil/ModbusWriteRegister/
# S7PlcStop/S7PlcStart) are DESTRUCTIVE — they change physical process state.
# Default false: read-only ICS enum works without it. Set true ONLY for
# authorized PLC testing. PHYSICAL-DAMAGE RISK: a coil/register write or PLC
# stop can change real-world process state. Dual-gated: @require_allowlist on
# run_attack_module (target in allowlist) AND ics.allow_write: true AND
# ics.destructive_ics: true (Phase 1 safety: both flags must be set; the
# allow_write default flipped to false so the checked-in config is safe).
ics:
  allow_write: false
  destructive_ics: false
plugins:
  enabled:
  - shodan_recon
  - github_dorks
  - webhook_notify
  - sliver_c2
  - bloodhound_ce
  - zap_scan
  - browser_attack
  - mobile_attack
  - wireless
  - spiderfoot
  - atomic_red_team
  - caldera
  - firmware_analysis
  disabled: []
  search_paths:
  - plugins
  entry_points: true
webhook_notify:
  # Lab build: enabled true. No-op without a url — logs once then drops events.
  # Set ``url`` to a Slack/Discord incoming webhook to actually receive pings.
  enabled: true
  url: ''
  events:
  - finding
  - state
  timeout_seconds: 5
  max_retries: 3
  backoff_seconds: 2.0
  max_payload_chars: 8192
mitre:
  # Lab build: enabled true. ``export_attack_navigator`` MCP tool writes
  # Navigator layer JSON to navigator_output_dir for SOC handoff.
  enabled: true
  technique_map: tools/mitre_technique_map.json
  navigator_output_dir: reports/mitre
  include_skill_tags: true
ticketing:
  # Lab build: enabled true. No-op without provider/base_url/token — logs
  # once then drops. Set provider (jira|github), base_url, and the named env
  # var (token_env) to actually create tickets from confirmed findings.
  enabled: true
  provider: ''
  base_url: ''
  token_env: TICKETING_TOKEN
  project_key: ''
  max_retries: 3
  backoff_seconds: 2.0
chatgpt:
  enabled: true
# Phase 6.3 (D6): Caldera adversary emulation plugin. Lab build: enabled true.
# The Caldera server is target-side — operator adds its IP to
# exploit.allowed_targets. The plugin's MCP tools (caldera_list_abilities,
# caldera_run_ability) are @require_allowlist-gated on the target IP. Set
# ``url`` to the Caldera server base URL and ``api_key_env`` to the env var
# holding the Caldera API key (default CALDERA_API_KEY).
caldera:
  enabled: true
  url: ''
  api_key_env: CALDERA_API_KEY
# Capability-upgrade agent block (design §23). Toggles + budgets for the task
# graph, capability discovery, AI-facing state tools, planner hints, decision
# logging, reflection, and retry/repair budgets. Defaults preserve today's
# behavior. ``max_actions: 0`` = use legacy exploit budgets (not a hard cap).
# config_cli.load_config merges NO defaults, so every consumer reads
# defensively via .get(key, default).
agent:
  task_graph_enabled: true
  capability_discovery_enabled: true
  state_tools_enabled: true
  planner_hints_enabled: true
  decision_log_enabled: true
  reflection_enabled: true
  max_retries_per_task: 2
  max_actions: 0
  generated_code_repair_attempts: 3
# Operator-box -> victim persistent RCE channel (Phase 7). The operator box
# hosts the beacon listener; the victim runs one of the implants below that
# beacons back. All victim touches are allowlist-gated (@require_allowlist);
# callback_host must be in exploit.allowed_targets (pivot lock). Default
# port/type are fallbacks when the tool caller omits them.
operator_connection:
  enabled: true
  auto_start_listener: true
  default_callback_port: 4444
  default_listener_type: netcat
  beacon_interval_seconds: 300
  health_check_interval_seconds: 60
  workspace_dir: exploit_workspace
